    proxies: ["🌏 Auto", "🇭🇰 香港 Auto", "🇯🇵 日本 Auto", "🇸🇬 新加坡 Auto", "🇺🇸 美国 Auto", all, DIRECT]
  - name: "🌏 Auto"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    lazy: true
    proxies: [all]
  - name: "🇯🇵 日本 Auto"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    lazy: true
    filter: "日本"
  - name: "🇸🇬 新加坡 Auto"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
