mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: '0.0.0.0:9090'
find-process-mode: strict

geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  cache-algorithm: arc
  listen: '0.0.0.0:1053'
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.localdomain'
    - '*.home.arpa'
    - 'localhost'
    - 'lens.l.google.com'
    - 'stun.l.google.com'
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '*.ntp.org.cn'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'mesu.apple.com'
    - 'swscan.apple.com'
    - 'swquery.apple.com'
    - 'swdownload.apple.com'
    - 'swcdn.apple.com'
    - 'swdist.apple.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'music.163.com'
    - '*.music.163.com'
    - '*.126.net'
    - '*.xiami.com'
    - '*.kuwo.cn'
    - 'proxy.golang.org'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - tls://1.1.1.1
    - tls://8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.googleapis.com'
      - '+.github.com'
      - '+.openai.com'
      - '+.anthropic.com'
      - '+.claude.ai'
      - '+.cursor.com'
      - '+.cursor.sh'
      - '+.cursorapi.com'
      - '+.cloudflare.com'
      - '+.discord.com'
      - '+.discordapp.com'
      - '+.ollama.com'
      - '+.ollama.ai'
      - '+.huggingface.co'
      - '+.hf.co'
      - '+.lobehub.com'
      - '+.stripe.com'
      - '+.amazonaws.com'
      - '+.vercel.com'
      - '+.vercel.app'
      - '+.steampowered.com'
      - '+.steamcommunity.com'
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  nameserver-policy:
    'geosite:cn,private':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    'geosite:gfw,openai,github,google,youtube,telegram':
      - tls://1.1.1.1
      - tls://8.8.8.8
    'domain:cursor.com,cursor.sh,cursorapi.com,anthropic.com,claude.ai,openai.com,github.com,cloudflare.com,googleapis.com,google.com,facebook.com,twitter.com,telegram.org,discord.com,discordapp.com,ollama.com,ollama.ai,huggingface.co,hf.co,lobehub.com,stripe.com,amazonaws.com,vercel.com,vercel.app,steampowered.com,steamcommunity.com':
      - tls://1.1.1.1
      - tls://8.8.8.8

sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - +.push.apple.com
    - Mijia Cloud
    - dlg.io.mi.com
    - +.apple.com
    - +.icloud.com
    - +.wechat.com
    - +.wechatapp.com
    - +.qpic.cn
    - +.qq.com
    - +.oray.com
    - +.sunlogin.net

